[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "astarots"
version = "0.1.0"
description = "Cross-chain invariant testing harness — unified beam search over Echidna, Halmos, and Slither"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tomlkit>=0.13.3"]

[project.scripts]
astarots = "devil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devil"]

[dependency-groups]
dev = [
    "halmos>=0.3.3",
    "pytest>=8",
    "ruff>=0.12",
    "slither-analyzer>=0.11.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
